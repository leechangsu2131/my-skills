# PR 마다 자동으로 도는 공용 점검 (T23).
# 비밀값 없이 도는 것만 넣는다. 기존 test.yml(school-todo-kakao 시험)은 그대로 둔다.
#
#   catalog  : python tools/build_catalog.py --check  (스킬 형식 점검)
#   privacy  : tools/check_privacy.py (T22) 로 PR 에서 새로 추가된 줄의 개인정보·비밀값 모양 검사
#              — 그 파일이 저장소에 아직 없으면 건너뛰고 알림만 남긴다.
#   tests    : 깨끗한 환경에 요구 파일만 설치해서 도는 것이 확인된 스킬 시험 (실패하면 빨간불)
#   known    : 지금 실패하는 시험이 섞인 스킬. 실패해도 PR 을 막지 않고 결과만 보여 준다.
#              고쳐지면 tests 쪽 matrix 로 옮긴다.
name: check

on:
  pull_request:
  push:
    branches: [main] # 교사 PC 는 main 에 바로 올리므로 push 에서도 점검
  workflow_dispatch: # Actions 탭 수동 실행

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  catalog:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 설치 (build_catalog.py 가 PyYAML 을 씀)
        run: pip install pyyaml
      - name: 스킬 형식 점검
        run: python tools/build_catalog.py --check

  privacy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # PR 이 갈라진 지점부터 비교하려고 기록 전체를 받는다
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 개인정보·비밀값 모양 검사 (PR 에서 새로 추가된 줄만)
        env:
          BASE_REF: ${{ github.base_ref }}
          BEFORE: ${{ github.event.before }}
        run: |
          if [ ! -f tools/check_privacy.py ]; then
            echo "::notice::tools/check_privacy.py(T22)가 아직 없어 개인정보 검사를 건너뜁니다."
            exit 0
          fi
          # T58 로 많이 줄었지만 사용자 경로·NEIS 10자리 코드 오탐이 남아(T78) 아직은 경고만 남기고 막지 않는다
          if [ -n "$BASE_REF" ]; then
            git diff "origin/${BASE_REF}...HEAD" | python tools/check_privacy.py --stdin --warn-only
          elif [ -n "$BEFORE" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ]; then
            git diff "$BEFORE...HEAD" | python tools/check_privacy.py --stdin --warn-only
          else
            echo "::notice::비교할 기준이 없어(수동 실행) 개인정보 검사를 건너뜁니다."
          fi

  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # 칸: name, dir, requirements(없으면 생략), extra(요구 파일에 빠진 패키지 — 공백으로 여러 개), target(기본 tests)
        include:
          # 깨끗한 가상환경에 요구 파일만 설치해 통과를 확인한 것들 (2026-11-25~26, docs/reviews/health-2026-11-26.md)
          - name: teacherlesson-assistant
            dir: skills/teacherlesson-assistant
            requirements: requirements.txt
            # tests 폴더 밖에 있는 시험 2개(가짜 로컬 서버만 씀)와 sites/(차시 자료 도우미) 시험도 함께 돌린다
            # 음악 도우미 시험은 selenium 이 있어야 불러와져 extra 로 설치한다(브라우저는 띄우지 않음)
            extra: selenium
            target: tests sites test_assistant_server.py test_supabase_schedule.py
          - name: teacherlesson-guide-splitter
            dir: skills/teacherlesson-guide/splitter
            requirements: requirements-dev.txt
          - name: personal-carrot
            dir: skills/personal-carrot
            requirements: requirements.txt
          - name: personal-library-search
            dir: skills/personal-library-search
            requirements: requirements.txt
          - name: util-pdf-translator
            dir: skills/util-pdf-translator
          - name: classmanage-exam-graderV2
            dir: skills/classmanage-exam-graderV2
            requirements: requirements.txt
            extra: httpx # starlette TestClient 가 쓰는데 요구 파일에 없음
          - name: personal-youtube-gemini-kakao-automation
            dir: skills/personal-youtube-gemini-kakao-automation/v
            requirements: requirements.txt
          # 아래 셋은 요구 파일에 패키지가 빠져 있어 extra 로 따로 설치한다(요구 파일은 교사 결정 뒤 정리)
          - name: classmanage-supabase-export
            dir: skills/classmanage-supabase-export
            extra: openpyxl requests pandas
          - name: personal-obsidansystem-main
            dir: skills/personal-obsidansystem-main
            extra: pyyaml
          - name: personal-daily-intake
            dir: skills/personal-daily-intake
            extra: requests
          - name: personal-record-trade
            dir: skills/personal-record-trade
            requirements: requirements-valuation.txt
            extra: gspread google-auth yfinance
          # 저장소 맨 위 tests/ (nlm·prepare_lessons·auto_split·check_privacy·build_catalog)
          - name: repo-root
            dir: .
            extra: pyyaml PyMuPDF
    name: tests (${{ matrix.name }})
    defaults:
      run:
        working-directory: ${{ matrix.dir }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 설치
        env:
          REQ: ${{ matrix.requirements }}
          EXTRA: ${{ matrix.extra }}
        run: |
          args=""
          if [ -n "$REQ" ]; then args="-r $REQ"; fi
          pip install $args $EXTRA pytest
      - name: 시험
        env:
          TARGET: ${{ matrix.target || 'tests' }}
        run: python -m pytest $TARGET -q

  known:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true # 알려진 실패가 있어 PR 을 막지 않음
    strategy:
      fail-fast: false
      matrix:
        include:
          # teacherlesson-schedule: tests/test_auto_planner.py 1개가 원래부터 실패(ISSUES 의 ISSUE-003).
          # requirements.txt 에 PyMuPDF 가 빠져 있어 여기서 따로 설치한다(server.py 가 fitz 를 불러옴).
          - name: teacherlesson-schedule
            dir: skills/teacherlesson-schedule
            requirements: requirements.txt
            extra: PyMuPDF
    name: known-failing (${{ matrix.name }})
    defaults:
      run:
        working-directory: ${{ matrix.dir }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 설치
        run: pip install -r ${{ matrix.requirements }} ${{ matrix.extra }} pytest
      - name: 시험
        run: python -m pytest tests -q
