name: morning-todo

on:
  # 깃허브 예약(cron)은 몇 시간씩 늦거나 건너뛰는 일이 있어, 외부 사이트(cron-job.org)가
  # 정해진 시각에 아래 workflow_dispatch를 호출하는 방식으로 바꿨다. (예약과 같이 두면 메시지가 두 번 간다)
  workflow_dispatch: # Actions 탭 수동 실행 + cron-job.org 호출

permissions:
  contents: read
  actions: read # 오늘 예약 실행이 이미 성공했는지 확인용

concurrency:
  group: morning-todo
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # 이 프로젝트가 저장소 맨 위가 아니라 하위 폴더에 있을 때의 위치 (맨 위면 이 3줄을 지운다)
    defaults:
      run:
        working-directory: skills/school-todo-kakao
    # 시트 주소(ID)도 Secrets에 두면 공개 로그에서 자동으로 가려진다.
    env:
      KAKAO_REST_API_KEY: ${{ secrets.KAKAO_REST_API_KEY }}
      KAKAO_CLIENT_SECRET: ${{ secrets.KAKAO_CLIENT_SECRET }}
      KAKAO_REFRESH_TOKEN: ${{ secrets.KAKAO_REFRESH_TOKEN }}
      KAKAO_FRIEND_UUIDS: ${{ secrets.KAKAO_FRIEND_UUIDS }}
      KAKAO_SEND_TO_ME: ${{ vars.KAKAO_SEND_TO_ME }}
      WEEKLY_FRIEND_UUIDS: ${{ secrets.WEEKLY_FRIEND_UUIDS }} # 주 1회 '출장' 메시지를 받을 사람(uuid, 쉼표로 최대 5명)
      WEEKLY_DAY: ${{ vars.WEEKLY_DAY }} # 보내는 요일 0=월 ... 6=일 (비우면 월요일)
      GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
      DB_SHEET_ID: ${{ secrets.DB_SHEET_ID }}
      SRC_WEEK_SHEET_ID: ${{ secrets.SRC_WEEK_SHEET_ID }}
      SRC_WEEK_GID: ${{ secrets.SRC_WEEK_GID }}
      SRC_TODAY_SHEET_ID: ${{ secrets.SRC_TODAY_SHEET_ID }}
      SRC_TODAY_GID: ${{ secrets.SRC_TODAY_GID }}
      MY_NAME: ${{ secrets.MY_NAME }}
    steps:
      - name: 오늘 예약 실행이 이미 성공했으면 건너뛰기 (백업 예약 중복 발송 방지)
        id: guard
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        working-directory: ${{ github.workspace }} # 아직 체크아웃 전이라 하위 폴더 기본값을 쓰지 않는다
        run: |
          since=$(date -u -d '8 hours ago' +%Y-%m-%dT%H:%M:%SZ)
          n=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow "morning-todo" --event schedule --status success --created ">=$since" --json databaseId --jq 'length')
          if [ "${n:-0}" -gt 0 ]; then echo "done=1" >> "$GITHUB_OUTPUT"; echo "앞선 예약 실행이 이미 성공해 건너뜁니다."; fi

      - uses: actions/checkout@v4
        if: steps.guard.outputs.done != '1'

      - uses: actions/setup-python@v5
        if: steps.guard.outputs.done != '1'
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: skills/school-todo-kakao/requirements.txt

      - if: steps.guard.outputs.done != '1'
        run: pip install -r requirements.txt

      - name: 공용 시트 → 일정DB 동기화
        id: sync
        if: steps.guard.outputs.done != '1'
        continue-on-error: true # 실패해도 아침 메시지는 보낸다(실패 사실을 메시지에 표시)
        run: python -m schooltodo sync

      - name: 아침 카톡 발송
        if: steps.guard.outputs.done != '1'
        env:
          SYNC_FAILED: ${{ steps.sync.outcome == 'failure' && '1' || '' }}
        run: python -m schooltodo morning

      # 만료 1달 전부터 카카오가 새 리프레시 토큰을 주면, 다음 실행을 위해 Secrets에 다시 저장한다.
      # GH_PAT: 이 저장소의 'Secrets 읽기/쓰기' 권한만 준 개인 액세스 토큰(fine-grained)
      - name: 갱신된 카카오 리프레시 토큰 저장
        if: always() && steps.guard.outputs.done != '1'
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          if [ -s new_refresh_token.txt ]; then
            if [ -z "$GH_TOKEN" ]; then
              echo "::warning::새 리프레시 토큰이 발급됐지만 GH_PAT이 없어 저장하지 못했습니다. 한 달 안에 설정하세요."
              exit 0
            fi
            gh secret set KAKAO_REFRESH_TOKEN --repo "$GITHUB_REPOSITORY" < new_refresh_token.txt
            echo "리프레시 토큰을 갱신해 저장했습니다."
          fi
