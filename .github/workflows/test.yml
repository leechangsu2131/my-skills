name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: skills/school-todo-kakao # 맨 위 폴더에 있으면 이 3줄을 지운다
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: skills/school-todo-kakao/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q
