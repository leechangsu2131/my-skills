include: package:flutter_lints/flutter.yaml

analyzer:
  errors:
    invalid_annotation_target: ignore  # freezed @JsonKey on constructor params
    dead_code: ignore  # placeholder data has intentional dead branches
    deprecated_member_use: ignore # naver map initialization transition warning

linter:
  rules:
    - prefer_const_constructors
    - prefer_const_declarations
    - avoid_print
    - prefer_single_quotes
    - sort_child_properties_last
