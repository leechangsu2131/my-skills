name: one_parent_watch
description: "한명만 - 부모 공동 육아 감독 앱"
version: 1.0.0+1
publish_to: 'none'

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # Backend
  supabase_flutter: ^2.8.0

  # Navigation
  go_router: ^14.6.0

  # Models / Serialization
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0

  # Location & Maps
  geolocator: ^13.0.2
  flutter_naver_map: ^1.3.0
  permission_handler: ^11.3.1

  # Push Notifications
  firebase_core: ^3.8.0
  firebase_messaging: ^15.1.6

  # Environment
  flutter_dotenv: ^5.2.1

  # UI Utilities
  intl: ^0.19.0
  cached_network_image: ^3.4.1
  google_sign_in: ^6.2.1
  flutter_svg: ^2.0.15
  shimmer: ^3.0.0
  gap: ^3.0.1
  google_fonts: ^6.2.1
  flutter_animate: ^4.5.2

  # Misc
  uuid: ^4.5.1
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

  # Code Generation
  riverpod_generator: ^2.6.2
  build_runner: ^2.4.13
  freezed: ^2.5.7
  json_serializable: ^6.8.0

flutter:
  uses-material-design: true

  assets:
    - .env
    - assets/
