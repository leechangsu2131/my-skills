[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lecturecapture"
version = "0.2.6"
description = "Local lecture video to slide-linked Obsidian notes"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "opencv-python>=4.8,<5.0",
  "numpy>=1.24",
]

[project.optional-dependencies]
youtube = ["yt-dlp>=2024.1.0"]
transcribe = ["faster-whisper>=1.0.0"]
test = ["pytest>=8.0"]

[project.scripts]
lecturecapture = "lecturecapture.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

