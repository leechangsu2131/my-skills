# config.toml 로 복사해 고친다 (config.toml은 .gitignore에 있다).
# 일정이 나에게 해당하는지 판단하는 규칙. 빼도 기본값으로 동작한다.
[classify]
my_grade = 3

# 이 말이 들어 있으면 '체육'으로 분류 (다른 학년 행사여도 체육 담당이면 챙긴다)
sports_keywords = ["체육", "대회", "육상", "축구", "양궁", "출전", "운동회", "체력", "스포츠클럽", "줄넘기", "수영", "paps", "소년체전"]

# 학년 표기 없이도 내 일이 아닌 것으로 보는 말 (일정DB에는 남고 아침 메시지에서만 빠진다)
exclude_keywords = ["유치원", "사서교사", "돌봄", "저학년", "고학년"]

# 이 말이 들어 있으면 내 학년 일정
mine_keywords = ["중학년"]
