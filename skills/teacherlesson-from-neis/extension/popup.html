<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NEIS 오늘의 수업</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main class="popup">
      <header>
        <div class="mark">N</div>
        <div>
          <h1>오늘의 수업</h1>
          <p>첫 조회 후 NEIS 등록 주차 자동 동기화 · 월간 가져오기도 지원</p>
        </div>
      </header>
      <label for="monthInput">가져올 달</label>
      <input id="monthInput" type="month" />
      <button id="weekButton" class="button secondary" type="button">현재 주 가져오기</button>
      <button id="monthButton" class="button primary" type="button">선택한 달 가져오기</button>
      <button id="studentButton" class="button students" type="button">오늘 출결·결석·체험학습 현황 조회</button>
      <p class="student-scope">오늘 출결과 이번 달 결석 신고서, NEIS 기본조건의 체험학습 신청서를 읽어 이 PC에 저장합니다.</p>
      <div id="status" role="status" aria-live="polite">NEIS에서 주간학습을 한 번 조회하면 등록된 나머지 주차도 자동으로 가져옵니다.</div>
      <button id="viewerButton" class="viewer-link" type="button">오늘의 수업 뷰어 열기 ↗</button>
      <p class="privacy">표시용 수업·출결 필드만 이 Chrome 프로필에 저장합니다. 사유와 연락처는 가져오지 않고 NEIS 신청·결재는 하지 않습니다.</p>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
